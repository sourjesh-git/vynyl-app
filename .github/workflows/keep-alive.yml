name: Server Cold-Start Keep-Alive

on:
  schedule:
    # Run every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping-server:
    runs-on: ubuntu-latest
    steps:
      - name: Ping NestJS Backend Health Endpoint
        run: |
          echo "Pinging Vynyl Server at $(date -u)"
          response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" --max-time 60 "https://vynyl-server.onrender.com/health" || echo "HTTP_STATUS:timeout")
          echo "$response"
          if [[ "$response" == *"HTTP_STATUS:200"* ]]; then
            echo "✅ Backend server is warm and healthy!"
          else
            echo "⚠️ Server ping returned non-200 response or timed out."
          fi
